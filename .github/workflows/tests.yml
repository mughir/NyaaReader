name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches the Docker image

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run pytest
        run: pytest

      - name: Combine smoke (stub vault + missing vault paths)
        run: |
          python combine.py /tmp/nyaa-no-vault-here 2>&1 || test $? -eq 2
          mkdir -p /tmp/nyaa-stub-vault/scrapers
          echo "# stub" > /tmp/nyaa-stub-vault/scrapers/private_stub.py
          python combine.py /tmp/nyaa-stub-vault
          test -f scrapers/private_stub.py
          rm scrapers/private_stub.py

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no secrets baked)
        run: docker build -t nyaa-reader:test .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check every served script
        run: |
          for f in frontend/*.js frontend/lib/*.js; do
            node --check "$f"
          done

      - name: Run frontend unit tests
        run: node --test tests/frontend/*.test.mjs
