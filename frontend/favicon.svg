<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5ae0"/>
      <stop offset="1" stop-color="#43328f"/>
    </linearGradient>
  </defs>
  <!-- rounded purple tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- simple white cat FACE only (no book/tail clutter that reads as a horse at 16px) -->
  <!-- head -->
  <circle cx="32" cy="34" r="20" fill="#fff7e8"/>

  <!-- ears: short, WIDE, set far apart — reads clearly as cat, not horse -->
  <path d="M16 22 L13 8 L27 15 Z" fill="#fff7e8"/>
  <path d="M48 22 L51 8 L37 15 Z" fill="#fff7e8"/>
  <path d="M17.4 20.5 L15.8 12.5 L24 16.8 Z" fill="#ff9eb5"/>
  <path d="M46.6 20.5 L48.2 12.5 L40 16.8 Z" fill="#ff9eb5"/>

  <!-- eyes: simple round, far apart -->
  <circle cx="25" cy="33" r="3.2" fill="#2b2418"/>
  <circle cx="39" cy="33" r="3.2" fill="#2b2418"/>
  <circle cx="26" cy="32" r="1.1" fill="#fff"/>
  <circle cx="40" cy="32" r="1.1" fill="#fff"/>

  <!-- nose + w mouth -->
  <path d="M30.2 39.5 L33.8 39.5 L32 41.6 Z" fill="#ff9eb5"/>
  <path d="M32 41.6 C31 42.9 30 43.1 28.9 42.4" stroke="#2b2418" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M32 41.6 C33 42.9 34 43.1 35.1 42.4" stroke="#2b2418" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- whiskers: short, subtle -->
  <line x1="19" y1="37" x2="12" y2="36" stroke="#2b2418" stroke-width="1.1" opacity=".5" stroke-linecap="round"/>
  <line x1="45" y1="37" x2="52" y2="36" stroke="#2b2418" stroke-width="1.1" opacity=".5" stroke-linecap="round"/>

  <!-- blush -->
  <circle cx="20" cy="39" r="2.6" fill="#ff9eb5" opacity=".45"/>
  <circle cx="44" cy="39" r="2.6" fill="#ff9eb5" opacity=".45"/>
</svg>
